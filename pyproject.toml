[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling via constrained decoding on Qwen3-0.6B"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "llm_sdk",
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
mypy_path = "llm_sdk"

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
